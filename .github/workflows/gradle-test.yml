name: Run unit tests

permissions:
  contents: read

on:
  pull_request:
    types:
      [ opened, reopened, edited, synchronize ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Test
      run: ./gradlew test

    - name: Publish test report on failure
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: test-report
        path: build/reports
        if-no-files-found: ignore
        retention-days: 1
